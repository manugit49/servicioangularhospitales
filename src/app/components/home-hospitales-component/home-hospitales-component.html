<h3>Lista hospitales</h3>
<table border="1" class="table table-borderer">
    <thead>
        <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Dirección</th>
            <th>Teléfono</th>
            <th>Camas</th>
        </tr>
    </thead>
@for(hospital of arrayhospitales; track hospital){
    <tbody>
        <tr>
            <td>{{hospital.idHospital}}</td>
            <td>{{hospital.nombre}}</td>
            <td>{{hospital.direccion}}</td>
            <td>{{hospital.telefono}}</td>
            <td>{{hospital.camas}}</td>
            <td>
                <a [routerLink]="['/delete', hospital.idHospital]" class="btn btn-danger">
                    Eliminar
                </a>
            </td>
        </tr>
    </tbody>
}
</table>
